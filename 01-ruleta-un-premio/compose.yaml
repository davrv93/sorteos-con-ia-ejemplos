# docker compose up -d --build    y abre http://127.0.0.1:8101
# El panel de administración está en http://127.0.0.1:8101/admin (la clave va en .env).
services:
  sorteo:
    build: .
    environment:
      PORT: "8080"
      SORTEO_DATOS: /datos
      SORTEO_CLAVE: ${SORTEO_CLAVE:-cambia-esta-clave-larga}
      SORTEO_TOTAL: ${SORTEO_TOTAL:-12}
    ports:
      - "127.0.0.1:${PUERTO:-8101}:8080"
    volumes:
      - datos:/datos
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  datos: {}
